name: CI builds

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Instalar dependencias e MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-mingw-w64-x86-64 nsis qt6-base-dev

      - name: Configurar Git
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Compilar Veyon para Windows
        run: |
          mkdir -p /tmp/build-win
          cd /tmp/build-win
          x86_64-w64-mingw32-cmake $GITHUB_WORKSPACE -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja

      - name: Guardar Instalador nos Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: Veyon-Windows-64bit
          path: |
            /tmp/build-win/*.exe
            /tmp/build-win/veyon*.exe
            veyon-*win*.exe