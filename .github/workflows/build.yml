name: CI builds

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Instalar compilador Windows (MinGW64 + Qt6 + Dependencias)
        run: |
          dnf install -y git cmake ninja-build patch sed \
            mingw64-gcc-c++ mingw64-nsis mingw64-pkg-config \
            mingw64-qt6-qtbase mingw64-qt6-qtdeclarative mingw64-qt6-qttools \
            mingw64-qt6-qtsvg mingw64-qt6-qt5compat mingw64-qt6-qttranslations \
            mingw64-openssl mingw64-qca-qt6 mingw64-qca \
            mingw64-libjpeg-turbo mingw64-libpng mingw64-zlib mingw64-lzo \
            mingw64-libvncserver mingw64-cyrus-sasl mingw64-openldap \
            qt6-qtbase-devel qt6-qttools-devel --skip-unavailable

      - name: Baixar codigo fonte completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compilar Veyon para Windows (.exe e .dll)
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          
          # Prepara os arquivos do VNC como no build.sh original
          $GITHUB_WORKSPACE/.ci/common/strip-ultravnc-sources.sh || true

          mkdir -p /tmp/build-win64
          cd /tmp/build-win64
          
          mingw64-cmake $GITHUB_WORKSPACE \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_QT6=ON \
            -DWITH_BUNDLED_LIBVNC=ON \
            -DWITH_PCH=OFF
          
          ninja
          ninja windows-binaries || true
          ninja win-nsi || true

      - name: Guardar Executavel e Plugin nos Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Veyon-Windows-64bit
          path: |
            /tmp/build-win64/**/*.exe
            /tmp/build-win64/**/*.dll
            /tmp/build-win64/veyon*
            veyon*