name: CI builds

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configurar Git
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Descarregar Imagem e Compilar Windows
        run: |
          docker pull registry.gitlab.com/veyon/ci-mingw-w64:main || true
          docker run --rm -v $GITHUB_WORKSPACE:/workspace -w /workspace registry.gitlab.com/veyon/ci-mingw-w64:main .ci/windows/build.sh x86_64
          docker run --rm -v $GITHUB_WORKSPACE:/workspace -w /workspace registry.gitlab.com/veyon/ci-mingw-w64:main .ci/windows/build.sh x86_64 win-nsi || true

      - name: Guardar Instalador nos Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: Veyon-Windows-64bit
          path: |
            veyon-win*
            veyon-*win*
            *.exe