name: CI builds

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    container:
      image: debian:11
    steps:
      - name: Instalar Docker no container Debian
        run: |
          apt-get update && apt-get install -y curl git
          curl -fsSL https://get.docker.com -o get-docker.sh && sh get-docker.sh || true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configurar Git
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Compilar com imagem oficial via Docker
        run: |
          # Puxa a imagem oficial pública do repositório do Veyon no Docker Hub
          docker pull veyon/ci.windows:latest || docker pull veyon/ci.windows || true
          
          # Executa o script de build dentro do ambiente correto
          docker run --rm -v $GITHUB_WORKSPACE:/workspace -w /workspace veyon/ci.windows:latest .ci/windows/build.sh x86_64 || \
          .ci/windows/build.sh x86_64

      - name: Gerar instalador NSIS (.exe)
        run: |
          .ci/windows/build.sh x86_64 win-nsi || true

      - name: Guardar Instalador nos Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: Veyon-Windows-64bit
          path: |
            veyon-win*
            veyon-*win*
            *.exe