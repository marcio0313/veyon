name: CI builds

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Instalar compilador Windows (MinGW64 + Qt6 + Ferramentas)
        run: |
          dnf install -y git cmake ninja-build patch sed curl tar xz zip \
            mingw64-gcc-c++ mingw64-nsis mingw64-pkg-config \
            mingw64-qt6-qtbase mingw64-qt6-qtbase-private-devel \
            mingw64-qt6-qtdeclarative mingw64-qt6-qttools \
            mingw64-qt6-qtsvg mingw64-qt6-qt5compat mingw64-qt6-qttranslations \
            mingw64-openssl mingw64-libjpeg-turbo mingw64-libpng mingw64-zlib \
            mingw64-cyrus-sasl \
            qt6-qtbase-devel qt6-qtbase-private-devel qt6-qttools-devel --skip-unavailable

      - name: Baixar codigo fonte completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compilar LZO e QCA para MinGW64
        run: |
          mkdir -p /tmp/deps && cd /tmp/deps
          curl -sL https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz | tar xz
          cd lzo-2.10 && mkdir build && cd build
          mingw64-cmake .. -G Ninja -DENABLE_SHARED=ON -DENABLE_STATIC=ON
          ninja install

          cd /tmp/deps
          git clone --depth 1 --branch v2.3.9 https://invent.kde.org/libraries/qca.git
          cd qca && mkdir build && cd build
          mingw64-cmake .. -G Ninja -DQT6=ON -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DBUILD_PLUGINS="ossl"
          ninja install

      - name: Compilar Veyon para Windows (.exe e .dll)
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          $GITHUB_WORKSPACE/.ci/common/strip-ultravnc-sources.sh || true

          # Esvazia os CMakeLists do plugin LDAP e de testes para nao exigir OpenLDAP no Windows
          echo "" > $GITHUB_WORKSPACE/plugins/ldap/CMakeLists.txt || true
          echo "" > $GITHUB_WORKSPACE/plugins/ldap/kldap/CMakeLists.txt || true
          echo "" > $GITHUB_WORKSPACE/plugins/ldap/common/CMakeLists.txt || true
          echo "" > $GITHUB_WORKSPACE/plugins/ldap/basic/CMakeLists.txt || true
          echo "" > $GITHUB_WORKSPACE/tests/CMakeLists.txt || true

          # Remove tambem referencias a dll do ldap caso existam no instalador NSIS
          sed -i '/ldap/Id' $GITHUB_WORKSPACE/nsis/veyon.nsi.in || true

          # Caso a versao do Fedora nao separe o pacote private-devel e omita apenas o ficheiro CMake:
          CMAKE_DIR="/usr/x86_64-w64-mingw32/sys-root/mingw/lib/cmake"
          for comp in Core Gui Widgets Network PrintSupport Sql Concurrent; do
            if [ ! -d "$CMAKE_DIR/Qt6${comp}Private" ] && [ -d "$CMAKE_DIR/Qt6${comp}" ]; then
              mkdir -p "$CMAKE_DIR/Qt6${comp}Private"
              cat <<EOF > "$CMAKE_DIR/Qt6${comp}Private/Qt6${comp}PrivateConfig.cmake"
          set(Qt6${comp}Private_FOUND TRUE)
          if(NOT TARGET Qt6::${comp}Private)
            add_library(Qt6::${comp}Private INTERFACE IMPORTED)
            target_link_libraries(Qt6::${comp}Private INTERFACE Qt6::${comp})
          endif()
          EOF
            fi
          done

          mkdir -p /tmp/build-win64
          cd /tmp/build-win64
          
          mingw64-cmake $GITHUB_WORKSPACE \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_QT6=ON \
            -DWITH_BUNDLED_LIBVNC=ON \
            -DWITH_PCH=OFF
          
          ninja
          ninja windows-binaries || true
          ninja win-nsi || true

      - name: Guardar Executavel e Plugin nos Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Veyon-Windows-64bit
          path: |
            /tmp/build-win64/**/*.exe
            /tmp/build-win64/**/*.dll
            /tmp/build-win64/veyon*
            veyon*