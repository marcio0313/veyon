name: CI builds

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Instalar compilador Windows (MinGW64 + Qt6 + NSIS)
        run: |
          dnf install -y git cmake ninja-build mingw64-gcc-c++ mingw64-nsis \
            mingw64-qt6-qtbase mingw64-qt6-qtdeclarative mingw64-qt6-qttools \
            mingw64-qt6-qtsvg mingw64-qt6-qt5compat mingw64-openssl \
            mingw64-libjpeg-turbo mingw64-libpng mingw64-zlib mingw64-lzo \
            mingw64-libvncserver mingw64-SASL mingw64-openldap \
            qt6-qtbase-devel qt6-qttools-devel --skip-unavailable

      - name: Baixar codigo fonte completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compilar Veyon para Windows (.exe e .dll)
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          
          # Cria atalho caso o qt-cmake6 do Fedora tenha o sufixo 6
          if [ ! -f /usr/x86_64-w64-mingw32/bin/qt-cmake ] && [ -f /usr/bin/mingw64-cmake ]; then
            mkdir -p /usr/x86_64-w64-mingw32/bin
            ln -sf /usr/bin/mingw64-cmake /usr/x86_64-w64-mingw32/bin/qt-cmake
          fi

          mkdir -p /tmp/build-win64
          cd /tmp/build-win64
          mingw64-cmake $GITHUB_WORKSPACE \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_QT6=ON
          
          ninja
          ninja win-nsi || true

      - name: Guardar Executavel e Plugin nos Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Veyon-Windows-64bit
          path: |
            /tmp/build-win64/**/*.exe
            /tmp/build-win64/**/*.dll
            /tmp/build-win64/plugins/webaccesscontrol/*.dll