name: CI builds

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    container: registry.gitlab.com/veyon/ci-mingw-w64:main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configurar Git
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Compilar Veyon para Windows 64-bit
        run: .ci/windows/build.sh x86_64

      - name: Guardar Instalador nos Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: Veyon-Windows-64bit
          path: |
            veyon-win*
            veyon-*win*