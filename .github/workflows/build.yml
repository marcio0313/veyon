name: CI builds

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo fonte completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Descobrir imagem Docker e Compilar Windows (.exe)
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          
          # Testa qual é o nome público exato da imagem MinGW do Veyon no Docker Hub / GHCR
          DOCKER_IMG=""
          for img in \
            "veyon/ci-mingw-w64:main" \
            "veyon/ci-mingw-w64:latest" \
            "veyon/ci.mingw.w64:latest" \
            "veyon/ci.windows:latest" \
            "ghcr.io/veyon/ci-mingw-w64:main" \
            "ghcr.io/veyon/veyon/ci-mingw-w64:main"; do
            echo "Testando imagem: $img ..."
            if docker pull "$img"; then
              DOCKER_IMG="$img"
              echo ">>> SUCESSO! Imagem encontrada: $DOCKER_IMG"
              break
            fi
          done

          if [ -z "$DOCKER_IMG" ]; then
            echo "Nenhuma imagem pre-pronta encontrada. Listando imagens publicas da conta veyon no Docker Hub:"
            curl -s "https://hub.docker.com/v2/repositories/veyon/?page_size=100" | jq -r '.results[].name'
            exit 1
          fi

          # Executa o script oficial do Windows dentro do container encontrado
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$DOCKER_IMG" \
            /bin/bash -c "git config --global --add safe.directory /workspace && .ci/windows/build.sh x86_64"

      - name: Guardar Instalador (.exe) nos Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-Veyon-Windows-64bit
          path: |
            veyon-win*
            veyon-*win*
            *.exe