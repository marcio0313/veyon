name: CI builds

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Instalar dependencias e compiladores MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-mingw-w64-x86-64 mingw-w64 nsis qt6-base-dev qt6-tools-dev libqt6svg6-dev libssl-dev

      - name: Configurar Git
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Compilar Veyon para Windows com script oficial
        run: |
          .ci/windows/build.sh x86_64
          .ci/windows/build.sh x86_64 win-nsi || true

      - name: Guardar Instalador nos Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: Veyon-Windows-64bit
          path: |
            veyon-win*
            veyon-*win*
            *.exe